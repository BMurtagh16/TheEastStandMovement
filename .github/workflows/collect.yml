name: Collect wire

on:
  schedule:
    # Four times a day, UTC. Roughly 07:00, 12:00, 17:00, 21:00 UK in summer.
    - cron: "0 7,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Run the wire
        working-directory: collector
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          CLAUDE_MODEL: claude-haiku-4-5-20251001
        run: python collect_wire.py

      - name: Commit the results
        run: |
          git config user.name "east-stand-collector"
          git config user.email "actions@github.com"
          git add docs/data logs
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "wire: $(date -u '+%Y-%m-%d %H:%M')"
          git pull --rebase --autostash
          git push
