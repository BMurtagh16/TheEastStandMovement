name: Mark the match

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Mark it
        working-directory: collector
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          CLAUDE_MODEL: claude-sonnet-5
        run: python collect_match.py

      - name: Commit the card
        run: |
          git config user.name "east-stand-collector"
          git config user.email "actions@github.com"
          git add docs/data
          git diff --staged --quiet && echo "no card this time" && exit 0
          git commit -m "match card: $(date -u '+%Y-%m-%d')"
          git pull --rebase --autostash
          git push
