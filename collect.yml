<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The East Stand Movement</title>
<meta name="description" content="A record of Manchester United, marked the same way every week.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="mast">
  <div class="wrap mast-in">
    <div>
      <p class="mast-eyebrow">Independent · unofficial · not affiliated with any club</p>
      <h1 class="mast-word">The East Stand<br>Movement</h1>
    </div>
    <div class="mast-mood" id="moodBlock">
      <div class="mast-label">Mood index</div>
      <div class="mood-num" id="moodNum">—</div>
      <svg class="mood-spark" id="moodSpark" viewBox="0 0 200 44" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="mast-label" id="moodSub">Awaiting the first run</div>
    </div>
  </div>
</header>

<div class="ticker">
  <div class="wrap ticker-in">
    <span id="tickCost">Running cost: —</span>
    <span id="tickCalls">—</span>
    <span id="tickNext">Next: —</span>
    <span id="tickUpdated">Updated: —</span>
  </div>
</div>

<main class="wrap">

  <section class="block" id="matchBlock">
    <h2 class="block-h">The last match, marked</h2>
    <div id="matchCard" class="loading">Reading the card…</div>
  </section>

  <section class="block">
    <h2 class="block-h">Rumour board</h2>
    <p class="block-note">Temperature rises with credible repetition and decays by
      12% a day. Anything untouched for three weeks moves to the graveyard, with
      its lifespan and the outlets that carried it.</p>
    <div id="rumourBoard" class="loading">Reading the board…</div>
  </section>

  <section class="block">
    <h2 class="block-h">The wire</h2>
    <div class="chips" id="chips"></div>
    <div id="wire" class="loading">Reading the wire…</div>
  </section>

</main>

<footer class="foot">
  <div class="wrap">
    <p><strong>How this is made.</strong> Scores, lineups and substitution minutes
      come from football-data.org and are verifiable. Everything else — the marks,
      the manager card, the mood index — is a language model reading published
      journalism and applying a fixed rubric. It is structured opinion, not
      analytics. It has no tracking data and no xG feed. Where a card could not be
      checked against the results feed it is labelled unverified.</p>
    <p>Stories are summarised and linked, never republished. Follow the source
      before repeating anything.</p>
    <p class="foot-cost" id="footCost"></p>
  </div>
</footer>

<script src="./app.js"></script>
</body>
</html>
