:root {
  --ink: #121212;
  --paper: #E7E4DC;
  --card: #FBFAF7;
  --yellow: #F2C500;
  --red: #C8102E;
  --grey: #6F6A63;
  --line: rgba(18,18,18,0.16);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Source Serif 4', Georgia, serif;
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

.wrap { max-width: 1060px; margin: 0 auto; padding: 0 22px; }

/* ---------- masthead ---------- */

.mast {
  background: var(--ink);
  color: var(--paper);
  border-bottom: 7px solid var(--yellow);
  padding: 26px 0 24px;
}
.mast-in {
  display: flex; flex-wrap: wrap; gap: 26px;
  align-items: flex-end; justify-content: space-between;
}
.mast-eyebrow {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--yellow); margin: 0 0 10px;
}
.mast-word {
  font-family: 'Anton', Impact, sans-serif;
  font-weight: 400;
  font-size: clamp(40px, 8.4vw, 78px);
  line-height: 0.86;
  letter-spacing: 0.005em;
  text-transform: uppercase;
  margin: 0;
}
.mast-mood { min-width: 210px; }
.mast-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--yellow); opacity: 0.9;
}
.mood-num {
  font-family: 'Anton', sans-serif;
  font-size: 52px; line-height: 1; margin: 4px 0 2px;
}
.mood-num[data-sign="neg"] { color: var(--red); }
.mood-num[data-sign="pos"] { color: var(--yellow); }
.mood-spark { width: 100%; height: 44px; display: block; margin-bottom: 4px; }

/* ---------- cost ticker: the site says what it costs to run ---------- */

.ticker {
  background: var(--yellow);
  border-bottom: 2px solid var(--ink);
}
.ticker-in {
  display: flex; flex-wrap: wrap; gap: 10px 26px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  padding-top: 9px; padding-bottom: 9px;
}

/* ---------- blocks ---------- */

.block { padding: 40px 0 8px; border-top: 1px solid var(--line); }
.block:first-child { border-top: 0; }
.block-h {
  font-family: 'Anton', sans-serif; font-weight: 400;
  font-size: clamp(24px, 4vw, 34px); text-transform: uppercase;
  letter-spacing: 0.01em; margin: 0 0 6px;
}
.block-note { color: var(--grey); font-size: 14.5px; margin: 0 0 20px; max-width: 62ch; }
.loading { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--grey); padding: 18px 0; }
.fail { border: 2px solid var(--red); background: var(--card); padding: 14px; font-size: 15px; }

/* ---------- match card ---------- */

.mc { background: var(--card); border: 2px solid var(--ink); }
.mc-top {
  display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between;
  align-items: baseline; padding: 16px 18px; border-bottom: 2px solid var(--ink);
}
.mc-fixture { font-family: 'Anton', sans-serif; font-size: 26px; text-transform: uppercase; }
.mc-meta { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--grey); letter-spacing: 0.08em; text-transform: uppercase; }
.mc-body { display: grid; grid-template-columns: 1fr 1fr; }
@media (max-width: 760px) { .mc-body { grid-template-columns: 1fr; } }
.mc-half { padding: 18px; }
.mc-half + .mc-half { border-left: 1px solid var(--line); }
@media (max-width: 760px) { .mc-half + .mc-half { border-left: 0; border-top: 1px solid var(--line); } }
.mc-h {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--grey);
  margin-bottom: 14px;
}
.mc-score { font-family: 'Anton', sans-serif; font-size: 46px; line-height: 1; margin-bottom: 12px; }

.axis { margin-bottom: 11px; }
.axis-top { display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 4px; }
.axis-bar { height: 9px; background: rgba(18,18,18,0.1); }
.axis-fill { height: 100%; background: var(--ink); }
.axis-fill[data-low="true"] { background: var(--red); }

.stat-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
.stat-row b { font-family: 'Anton', sans-serif; font-size: 17px; font-weight: 400; }
.verdict { margin: 14px 0 0; font-size: 15.5px; }
.counter { margin-top: 12px; padding: 11px 12px; background: rgba(242,197,0,0.28); font-size: 14.5px; border-left: 4px solid var(--yellow); }
.unverified { display: inline-block; background: var(--red); color: #fff; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 7px; }

/* ---------- rumours ---------- */

.rum { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.rum-name { font-family: 'Anton', sans-serif; font-size: 19px; text-transform: uppercase; min-width: 150px; }
.rum-track { flex: 1; height: 12px; background: rgba(18,18,18,0.1); min-width: 90px; }
.rum-heat { height: 100%; background: var(--red); }
.rum-meta { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--grey); letter-spacing: 0.05em; text-transform: uppercase; text-align: right; min-width: 132px; }
.rum[data-cold="true"] { opacity: 0.5; }
.rum[data-cold="true"] .rum-heat { background: var(--grey); }
.tier { display: inline-block; background: var(--ink); color: var(--paper); padding: 1px 5px; font-size: 9.5px; }

/* ---------- wire ---------- */

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.chip {
  font-family: 'IBM Plex Mono', monospace; font-size: 10.5px;
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 7px 11px; border: 1.5px solid var(--ink);
  background: transparent; color: var(--ink); cursor: pointer;
}
.chip:hover { background: rgba(18,18,18,0.08); }
.chip[data-on="true"] { background: var(--ink); color: var(--paper); }

.story { display: grid; grid-template-columns: 96px 1fr; gap: 18px; padding: 16px 0 16px 10px; border-top: 1px solid var(--line); border-left: 3px solid transparent; }
.story:hover { border-left-color: var(--yellow); }
@media (max-width: 560px) { .story { grid-template-columns: 1fr; gap: 6px; } }
.story-meta { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--grey); letter-spacing: 0.05em; }
.story h3 { font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 19px; line-height: 1.28; margin: 0 0 5px; }
.story h3 a { color: inherit; text-decoration: none; box-shadow: inset 0 -2px 0 rgba(242,197,0,0.9); }
.story h3 a:hover { box-shadow: inset 0 -12px 0 rgba(242,197,0,0.55); }
.story p { margin: 0; font-size: 15.5px; color: #35312D; }
.story-src { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--grey); margin-top: 7px; letter-spacing: 0.05em; text-transform: uppercase; }

/* ---------- footer ---------- */

.foot { background: var(--ink); color: #CFCBC2; margin-top: 54px; padding: 34px 0 44px; font-size: 14px; }
.foot p { max-width: 68ch; }
.foot strong { color: var(--yellow); }
.foot-cost { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--yellow); }
